[package]
name = "invertonator"
version = "0.3.0-alpha.13"
edition = "2021"
description = "System-wide dark mode that websites cannot see."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_Media",
]}

[target.'cfg(unix)'.dependencies]
# dlopen-based Xlib/XRandR bindings — no build-time X headers required.
x11-dl = "2"

[profile.release]
opt-level = 3
lto = true
strip = true
