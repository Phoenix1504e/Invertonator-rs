name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Type-check
        run: cargo check --locked --verbose

      - name: Build release
        run: cargo build --release --locked

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: Invertonator-rs-${{ github.sha }}
          path: target/release/invertonator.exe
          if-no-files-found: error

      - name: Upload exe (latest alias)
        uses: actions/upload-artifact@v4
        with:
          name: Invertonator-rs-latest
          path: target/release/invertonator.exe
          if-no-files-found: error
