name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: invertonator.exe
            artifact: Invertonator-rs-windows-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: invertonator
            artifact: Invertonator-rs-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Type-check
        run: cargo check --locked --verbose

      - name: Build release
        run: cargo build --release --locked

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: target/release/${{ matrix.exe }}
          if-no-files-found: error

      - name: Upload binary (latest alias)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-latest
          path: target/release/${{ matrix.exe }}
          if-no-files-found: error
